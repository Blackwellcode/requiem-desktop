; Requiem: gesperrter Wochentag / Datum / Zeit im Mond-Stil
; Palette gemessen aus seele_desktop_4k.jpg (siehe README.md)
; Hinweis: Datei muss als UTF-16 LE gespeichert sein (Umlaute, Mittelpunkt) - apply.ps1 erledigt das.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Requiem
Author=Blackwellcode
Information=Mond-artiger Wochentag fuer das Seele-Blackwell-Gothic-Theme
Version=1.0
License=MIT

[Variables]
ColorText=230,226,222,255
ColorSilver=160,160,158,255
ColorEmber=192,62,69,255
FontDisplay=Segoe UI Variable Display
FontText=Segoe UI Variable Text
SizeDay=80
SizeSub=14
SpacingDay=26
SpacingSub=7

; ---------- Measures ----------
[MeasureDay]
Measure=Time
Format=%A
FormatLocale=de-DE

[MeasureDate]
Measure=Time
Format=%d · %B · %Y
FormatLocale=de-DE

[MeasureTime]
Measure=Time
Format=%H : %M

; ---------- Meters ----------
[MeterDay]
Meter=String
MeasureName=MeasureDay
X=0
Y=0
FontFace=#FontDisplay#
FontWeight=200
FontSize=#SizeDay#
FontColor=#ColorText#
StringCase=Upper
AntiAlias=1
InlineSetting=CharacterSpacing | 0 | #SpacingDay#
InlineSetting2=Shadow | 0 | 2 | 14 | 0,0,0,220
Padding=0,0,30,20

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=4
Y=4R
FontFace=#FontText#
FontWeight=400
FontSize=#SizeSub#
FontColor=#ColorSilver#
StringCase=Upper
AntiAlias=1
InlineSetting=CharacterSpacing | 0 | #SpacingSub#
InlineSetting2=Shadow | 0 | 1 | 8 | 0,0,0,230
Padding=0,0,10,6

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=4
Y=2R
FontFace=#FontText#
FontWeight=400
FontSize=#SizeSub#
FontColor=#ColorEmber#
AntiAlias=1
InlineSetting=CharacterSpacing | 0 | #SpacingSub#
InlineSetting2=Shadow | 0 | 0 | 10 | 192,62,69,170
Padding=0,0,10,10
