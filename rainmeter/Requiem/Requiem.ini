; Requiem: spaced weekday / date / time (Mond style)
; Palette sampled from wallpaper/seele-desktop.jpg
; Sizes scale with the height of the screen the skin is on.
; #SCREENAREAHEIGHT# is reported in DPI-scaled (logical) pixels, the same
; unit Rainmeter uses for FontSize, so the result is independent of the
; Windows scaling level. Reference: 1440 px at 125 % = 1152 logical px
; -> weekday 80, date/time 14.
; Note: Rainmeter needs this file as UTF-16 LE for non-ASCII characters;
; apply.ps1 and build.ps1 convert it automatically.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Requiem
Author=Blackwellcode
Information=Minimal gothic weekday clock for the Requiem desktop theme. Language follows the Windows date/time format; size follows the screen height.
Version=1.1.0
License=MIT

[Variables]
ColorText=230,226,222,255
ColorSilver=160,160,158,255
ColorEmber=192,62,69,255
FontDisplay=Segoe UI Variable Display
FontText=Segoe UI Variable Text
; Divisors relative to the logical screen height (1152 / 14.4 = 80)
DivDay=14.4
DivSub=82.3
DivSpacingDay=44.3
DivSpacingSub=164.6

; ---------- Scaling ----------
[MeasureSizeDay]
Measure=Calc
Formula=Max(Round(#SCREENAREAHEIGHT# / #DivDay#), 24)

[MeasureSizeSub]
Measure=Calc
Formula=Max(Round(#SCREENAREAHEIGHT# / #DivSub#), 9)

[MeasureSpacingDay]
Measure=Calc
Formula=Round(#SCREENAREAHEIGHT# / #DivSpacingDay#)

[MeasureSpacingSub]
Measure=Calc
Formula=Round(#SCREENAREAHEIGHT# / #DivSpacingSub#)

; ---------- Time ----------
[MeasureDay]
Measure=Time
Format=%A
FormatLocale=Local

[MeasureDate]
Measure=Time
Format=%d · %B · %Y
FormatLocale=Local

[MeasureTime]
Measure=Time
Format=%H : %M

; ---------- Meters ----------
[MeterDay]
Meter=String
MeasureName=MeasureDay
X=0
Y=0
FontFace=#FontDisplay#
FontWeight=200
FontSize=[MeasureSizeDay]
FontColor=#ColorText#
StringCase=Upper
AntiAlias=1
InlineSetting=CharacterSpacing | 0 | [MeasureSpacingDay]
InlineSetting2=Shadow | 0 | 2 | 14 | 0,0,0,220
Padding=0,0,30,20
DynamicVariables=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=4
Y=4R
FontFace=#FontText#
FontWeight=400
FontSize=[MeasureSizeSub]
FontColor=#ColorSilver#
StringCase=Upper
AntiAlias=1
InlineSetting=CharacterSpacing | 0 | [MeasureSpacingSub]
InlineSetting2=Shadow | 0 | 1 | 8 | 0,0,0,230
Padding=0,0,10,6
DynamicVariables=1

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=4
Y=2R
FontFace=#FontText#
FontWeight=400
FontSize=[MeasureSizeSub]
FontColor=#ColorEmber#
AntiAlias=1
InlineSetting=CharacterSpacing | 0 | [MeasureSpacingSub]
InlineSetting2=Shadow | 0 | 0 | 10 | 192,62,69,170
Padding=0,0,10,10
DynamicVariables=1
